name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run Pylint
        run: python -m pylint src tests --score=y

      - name: Run tests
        run: python -m pytest -q

      - name: Run offline evaluation
        run: python -m guardrail_rag.evaluation.runner --version v2

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag guardrail-rag:ci .
      - name: Start container
        run: docker run --detach --name guardrail-rag-ci --publish 8000:8000 guardrail-rag:ci
      - name: Wait for health
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs guardrail-rag-ci
          exit 1
      - name: Query container
        run: |
          curl --fail --silent http://127.0.0.1:8000/query \
            --header 'content-type: application/json' \
            --data '{"question":"What approvals are required for a production network change?","role":"network_engineer"}'
      - name: Stop container
        if: always()
        run: docker rm --force guardrail-rag-ci

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
